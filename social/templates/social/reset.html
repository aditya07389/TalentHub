<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .input-field {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-field label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    .input-field input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background-color: #fafafa;
      transition: border-color 0.2s;
    }

    .input-field input:focus {
      outline: none;
      border-color: #b4b4b4;
    }

    .btn-container {
      text-align: center;
    }

    .btn {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #3897f0;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2680d6;
    }

    .btn-back {
      display: block;
      margin-top: 20px;
      color: #262626;
      font-size: 14px;
      text-decoration: none;
    }

    .btn-back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Forgot Password</h2>
    <form id="forgot-password-form" method="POST" action="/reset">
      {% csrf_token %}
      <div class="input-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="btn-container">
        <button type="submit" class="btn">Send Reset Link</button>
        <a href="/" class="btn-back">Back to Login</a>
      </div>
    </form>
  </div>
</body>
</html>
