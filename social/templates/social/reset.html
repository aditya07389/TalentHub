<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentHub - Forgot Password</title>
  <style>
    :root {
      font-size: 16px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f4ec;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 2.5rem 2rem;
      margin: 2.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.15);
      width: 90%;
      max-width: 25rem;
      text-align: center;
      color: #5c4033;
    }

    h2 {
      margin-bottom: 0.625rem;
      font-size: 1.375rem;
      color: #8b5e3c;
      font-weight: bold;
    }

    .description {
      font-size: 0.875rem;
      color: #7a6e5a;
      margin-bottom: 1.25rem;
    }

    .input-field {
      margin-bottom: 1.25rem;
      text-align: left;
      margin: 0 auto;
    }

    .input-field label {
      display: block;
      margin-bottom: 0.3125rem;
      font-weight: bold;
      font-size: 0.875rem;
      color: #5c4033;
    }

    .input-field input {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 0.0625rem solid #e0c8a4;
      border-radius: 0.3125rem;
      background-color: #faf9f5;
      transition: border-color 0.2s;
    }

    .input-field input:focus {
      outline: none;
      border-color: #b79b70;
    }

    .btn-container {
      text-align: center;
      margin-top: 0.9375rem;
    }

    .btn {
      padding: 0.625rem 1.5rem;
      font-size: 1rem;
      background-color: #8b5e3c;
      color: #fff;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #73492e;
    }

    .btn-back {
      display: block;
      margin-top: 1.25rem;
      color: #7a6e5a;
      font-size: 0.875rem;
      text-decoration: none;
    }

    .btn-back:hover {
      text-decoration: underline;
    }

    /* Responsive Styling */
    @media (max-width: 48rem) {
      .container {
        width: 85%;
        padding: 2rem;
      }
      
      h2 {
        font-size: 1.25rem;
      }

      .description {
        font-size: 0.8125rem;
      }
    }
  </style>
</head>
<body>
  
  <div class="container">
    <h2>Forgot Password</h2>
    <p class="description">
      Enter your email to receive a reset link. Please check your inbox for instructions on creating a new password.
    </p>
    <form id="forgot-password-form" method="POST">
      {% csrf_token %}
      <div class="input-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="btn-container">
        <button type="submit" class="btn">Send Reset Link</button>
        <a href="/" class="btn-back">Back to Login</a>
      </div>
    </form>
  </div>
</body>
</html>
