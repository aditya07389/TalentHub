{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentHub Signup</title>
    <link rel="stylesheet" href="{% static 'social/signup.css'%}">
</head>
<body>
  <div class="container">
    <div class="signup-box">
        <h1 class="logo">TalentHub</h1>
        <p class="subtitle">Sign up to see photos and videos from your friends.</p>
        <form method="post">
          {% csrf_token %}
            <input type="email" id="email" name="email" placeholder="Email" Required>
            <input type="text" id="username" name="username" placeholder="Username" Required>
            <input type="password" id="password1" name="password1" placeholder="Password" Required>
            <input type="password" id="password2" name="password2" placeholder="Enter Password again" Required>
            <button type="submit">Sign Up</button>
        </form>
        <p class="terms">By signing up, you agree to our <a href="#">Terms</a>
        <p class="terms">&</p>  
        <p class="terms"><a href="#">Conditions</a>

            {% for message in messages %}
            <p style="color: red">{{ message }}</p>
            {% endfor %}



    </div>
  </div>
</body>
</html>
